name: Render 24/7 Keep-Alive

on:
  schedule:
    # Har 5 daqiqada Render serveriga tashqi so'rov yuborib turadi (Render 15 daqiqada uxlaydi)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          echo "Pinging https://dentacare-app.onrender.com/api/health..."
          curl -sL -f -m 60 -A "GitHubActions-KeepAlive/2.0" "https://dentacare-app.onrender.com/api/health" || \
          curl -sL -m 60 -A "GitHubActions-KeepAlive/2.0" "https://dentacare-app.onrender.com/" || \
          echo "Ping request completed"
